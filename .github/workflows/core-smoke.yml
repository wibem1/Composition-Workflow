name: Composition Workflow Core
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        run: python -m compileall -q Engine/workflow-core
      - name: Python smoke tests
        run: python -m unittest discover -s Engine/workflow-core -p 'test_runtime.py' -v
  javascript-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check Engine/workflow-core/runtime.js
  lua-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua syntax
        run: luac5.4 -p Engine/workflow-core/runtime.lua
