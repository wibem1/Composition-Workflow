name: Engine regression tests

on:
  push:
    branches: [ main, stabilize-engine-2.2.3, dev/abc-performance-2.11.0 ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check composition-engine.js
      - name: Engine regression suite
        run: node tests/engine-regression.test.js
